<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eef2f7;
            margin: 0;
        }
        .header {
            background-color: #243447;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .exam {
            width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px gray;
        }
        .number {
            color: #607d8b;
            font-size: 14px;
        }
        .question {
            font-size: 20px;
            margin: 15px 0 25px;
        }
        .option {
            padding: 14px;
            margin: 12px 0;
            border: 2px solid #d6dce2;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f8fafc;
        }
        .option:hover {
            background-color: #e8f1f8;
        }
        .selected {
            background-color: #c8e6c9;
            border-color: #388e3c;
        }
        .submit {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background-color: #243447;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ONLINE EXAM</h1>
        <p>Computer Fundamentals</p>
    </div>

    <div class="exam">

        <div class="number">Question 01 of 10</div>

        <div class="question">
            Which device is used to type text into a computer?
        </div>

        <div class="option" onclick="selectAnswer(this)">
            A. Keyboard
        </div>

        <div class="option" onclick="selectAnswer(this)">
            B. Monitor
        </div>

        <div class="option" onclick="selectAnswer(this)">
            C. Speaker
        </div>

        <div class="option" onclick="selectAnswer(this)">
            D. Printer
        </div>

        <button class="submit"
                onclick="submitAnswer()"
                onmouseover="buttonOver(this)"
                onmouseout="buttonOut(this)">
            Submit Answer
        </button>
        <div id="message"></div>

    </div>
    <script>
        var selectedAnswer = null;

        function selectAnswer(option) {

            var options = document.getElementsByClassName("option");

            for (var i = 0; i < options.length; i++) {
                options[i].classList.remove("selected");
            }

            option.classList.add("selected");
            selectedAnswer = option.innerText;
        }

        function submitAnswer() {

            if (selectedAnswer == null) {
                document.getElementById("message").innerHTML =
                    "Please select an answer first.";
            }
            else {
                document.getElementById("message").innerHTML =
                    "Answer Submitted Successfully";
            }
        }

        function buttonOver(button) {
            button.style.backgroundColor = "#1565c0";
        }

        function buttonOut(button) {
            button.style.backgroundColor = "#243447";
        }

        document.addEventListener("keydown", function(event) {

            if (event.key == "Enter") {
                submitAnswer();
            }

        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Technical Symposium Registration</title>
    <style>
		.body{
			background-color:cyan;
		}
        .registration-box {
            border: 3px solid #2c3e50;  
            padding: 25px;           
            max-width: 550px;         
            margin: 30px auto;         
            border-radius: 10px;  
			background-color:white;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;      
        }
        label {
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box; 
        }
        video, audio {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body style="background-color:skyblue;">
    <div class="registration-box">
        
        <h2 style="text-align: center; color: #2c3e50;">National Technical Symposium</h2>
        <h3 style="text-align: center;">Registration Portal</h3>
        <div class="form-group">
            <p><label>Listen to the Welcome Message:</label></p>
            <audio controls>
                <source src="/VIDEOS/audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        <div class="form-group">
            <p><label>Symposium Teaser / Promotional Video:</label></p>
            <video controls poster="thumbnail.jpg">
                <source src="/VIDEOS/welcome.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </div>
        <hr>
        <form action="#" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Participant Name:</label>
                <input type="text" id="name" name="participant_name" placeholder="Enter your full name" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label for="reg_num">Register Number:</label>
                <input type="text" id="reg_num" name="register_number" placeholder="Enter your college register number" required pattern="[A-Za-z0-9]+" title="Only alphanumeric characters allowed">
            </div>
            <div class="form-group">
                <label for="college">College Name:</label>
                <input type="text" id="college" name="college_name" placeholder="Enter your institution name" required>
            </div>
            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" name="email_id" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" name="mobile_number" placeholder="10-digit mobile number" required pattern="[6-9][0-9]{9}" title="Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="date_of_birth" required>
            </div>
            <div class="form-group">
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </div>
            <div class="form-group">
                <label for="dept">Department:</label>
                <select id="dept" name="department" required>
                    <option value="" disabled selected>-- Select your Department --</option>
                    <option value="CSE">Computer Science & Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics & Communication</option>
                    <option value="EEE">Electrical & Electronics</option>
                    <option value="MECH">Mechanical Engineering</option>
                </select>
            </div>
            <div class="form-group">
                <label>Technical Skills:</label><br>
                <input type="checkbox" id="skill1" name="skills" value="C_Cpp">
                <label for="skill1">C / C++</label><br>
                
                <input type="checkbox" id="skill2" name="skills" value="Java_Python">
                <label for="skill2">Java / Python</label><br>
                
                <input type="checkbox" id="skill3" name="skills" value="Web_Dev">
                <label for="skill3">Web Development (HTML/CSS/JS)</label><br>
            
                <input type="checkbox" id="skill4" name="skills" value="Data_Structures">
                <label for="skill4">Data Structures & Algorithms</label>
            </div>
            <div class="form-group">
                <label for="id_card">Upload Student ID Card (Image/PDF):</label><br>
                <input type="file" id="id_card" name="id_card_file" accept="image/*,.pdf" required>
            </div>
            <div class="form-group">
                <label for="event_date">Event Date:</label>
                <input type="date" id="event_date" name="symposium_date" required>
            </div>
            <div class="form-group" style="margin-top: 25px; display: flex; gap: 15px;">
                <button type="submit" style="flex: 1; padding: 10px; background-color: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold;">Submit</button>
                <button type="reset" style="flex: 1; padding: 10px; background-color: #e0e0e0; color: black; border: none; cursor: pointer; font-weight: bold;">Reset</button>
            </div>
        </form>
        </div>
</body>
</html>

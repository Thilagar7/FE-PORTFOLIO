<!DOCTYPE html>
<html>
<head>
    <title>Hospital Footer</title>
    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            min-height:100vh;
            position:relative;
        }
        .footer{
            background-color:midnightblue;
            color:white;
            width:100%;
            padding:20px;
            position:fixed;
            bottom:0;
            left:0;
            overflow:hidden;
        }
        .left{
            float:left;
            width:75%;
        }
        .right{
            float:right;
            width:20%;
			height:120px;
			line-height:120px;
            text-align:center;
			
			
        }
        .logo{
            width:150px;
            height:150px;
			vertical-align:middle;
        }
        h2,p{
            margin:8px 0;
        }
    </style>
</head>
<body>
    <div style="padding:20px;">
        <h1>Hospital Management System</h1>
    </div>
    <div class="footer">
        <div class="left">
            <h2>VIT Health Care Center</h2>
            <p><b>Quick Links:</b> Home | Departments | Doctors | Appointments</p>
            <p><b>Social Media:</b> Facebook | Instagram | LinkedIn</p>
            <p><b>Email:</b> support@vithealthcare.com</p>
            <p>© 2026 VIT Health Care Center. All Rights Reserved.</p>
        </div>
        <div class="right">
            <img src="IMAGES/hosplogo.png" alt="VIT Health Logo" class="logo">
        </div>
    </div>
</body>
</html>

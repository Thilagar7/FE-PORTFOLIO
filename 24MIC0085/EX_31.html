<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Interactive Traffic Signal</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: whi
}
.signal {
    width: 120px;
    background-color: black;
    padding: 20px;
    margin: 30px auto;
    border-radius: 20px;
}
.light {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 15px auto;
    opacity: 0.7;
}
.red {
    background-color: red;
}
.yellow {
    background-color: yellow;
}
.green {
    background-color: green;
}
#message {
    font-size: 25px;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Traffic Signal</h1>
<div class="signal">
    <div class="light red" onmouseover="showMessage('STOP', this)"
         onmouseout="resetSignal(this)"></div>

    <div class="light yellow" onmouseover="showMessage('READY', this)"
         onmouseout="resetSignal(this)"></div>

    <div class="light green" onmouseover="showMessage('GO', this)"
         onmouseout="resetSignal(this)"></div>
</div>
<p id="message"></p>
<script>
function showMessage(text, signal) {
    signal.style.opacity = "1";
    signal.style.transform = "scale(1.1)";
    document.getElementById("message").innerHTML = text;
}

function resetSignal(signal) {
    signal.style.opacity = "0.7";
    signal.style.transform = "scale(1)";
    document.getElementById("message").innerHTML ="";
}
</script>
</body>
</html>

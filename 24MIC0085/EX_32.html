<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Interactive Weather Status</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f2f2f2;
}
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 50px;
}
.weather {
    width: 150px;
    padding: 25px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
    cursor: pointer;
}
.weather:hover {
    transform: scale(1.05);
}
.icon {
    font-size: 50px;
}
#message {
    margin-top: 30px;
    font-size: 25px;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Weather Status</h1>

<div class="container">
    <div class="weather" onmouseover="showMessage('Perfect Day!', this)"
         onmouseout="resetPanel(this)">
        <div class="icon">☀️</div>
        <h2>Sunny</h2>
    </div>

    <div class="weather" onmouseover="showMessage('Cloudy Weather', this)"
         onmouseout="resetPanel(this)">
        <div class="icon">☁️</div>
        <h2>Cloudy</h2>
    </div>

    <div class="weather" onmouseover="showMessage('Carry an Umbrella!', this)"
         onmouseout="resetPanel(this)">
        <div class="icon">🌧️</div>
        <h2>Rainy</h2>
    </div>
</div>

<p id="message"</p>

<script>
function showMessage(text, panel) {
    panel.style.backgroundColor = "lightblue";
    panel.style.transform = "scale(1.1)";
    document.getElementById("message").innerHTML = text;
}

function resetPanel(panel) {
    panel.style.backgroundColor = "white";
    panel.style.transform = "scale(1)";
    document.getElementById("message").innerHTML =
        "";
}
</script>
</body>
</html>

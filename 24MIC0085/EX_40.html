<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>College Events 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }
        header {
            background-color: #182848;
            color: white;
            text-align: center;
            padding: 25px;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        main {
            text-align: center;
            padding: 70px 20px;
        }
        .event-box {
            background-color: white;
            padding: 40px;
            max-width: 700px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px #cccccc;
        }
        .event-box h2 {
            color: #182848;
            margin-bottom: 20px;
        }
        .event-box p {
            font-size: 17px;
            color: #555;
        }
        footer {
            background-color: #182848;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>College Events 2026</h1>
    </header>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="nav-link text-white mx-3" href="#">Home</a>
            <a class="nav-link text-white mx-3" href="#">Events</a>
            <a class="nav-link text-white mx-3" href="#">Gallery</a>
            <a class="nav-link text-white mx-3" href="#">Contact</a>
        </div>
    </nav>
    <main>
        <div class="event-box">
            <h2>Welcome to Our College Events</h2>
            <p>
                Experience a year filled with exciting cultural programs,
                technical events, workshops and celebrations.
            </p>
            <button class="btn btn-primary">
                View Events
            </button>
        </div>
    </main>
    <footer>
        © 2026 College Events
    </footer>
</body>
</html>
